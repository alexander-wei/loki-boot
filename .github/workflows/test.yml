name: Test publisher

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n loki-boot/debian/loki-boot.sh
      - name: Run publisher regression tests
        run: python3 -m unittest discover -s tests -v
