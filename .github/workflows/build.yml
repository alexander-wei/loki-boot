name: Build and Push Docker Image

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            architecture: amd64
          - platform: linux/arm64
            architecture: arm64
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2

    - name: Set up Docker BuildKit
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile.debian
        platforms: ${{ matrix.platform }}
        push: true
        tags: "ghcr.io/${{ github.repository }}:latest-linux-${{ matrix.architecture }}"
        labels: |
          org.opencontainers.image.platform=${{ matrix.platform }}

  publish-manifest:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
    - name: Set up Docker BuildKit
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Create multi-platform latest tag
      run: |
        docker buildx imagetools create \
          --tag "ghcr.io/${{ github.repository }}:latest" \
          "ghcr.io/${{ github.repository }}:latest-linux-amd64" \
          "ghcr.io/${{ github.repository }}:latest-linux-arm64"
